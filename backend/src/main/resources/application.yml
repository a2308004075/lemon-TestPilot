spring:
  application:
    name: testpilot-backend
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/lemon_testpilot?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

server:
  port: 3344

logging:
  level:
    com.testpilot: info
    org.hibernate.SQL: warn
